      ];
      let components = [sampleComponents[0]];
      let savedEmpty = false;
      let nextSample = 1;

      function renderIcons() {
        if (window.lucide &amp;&amp; typeof window.lucide.createIcons === &#x27;function&#x27;) window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
      }

      function showScreen(name) {
        root.querySelectorAll(&#x27;.dd-screen&#x27;).forEach(el =&gt; el.classList.toggle(&#x27;active&#x27;, el.dataset.screenPanel === name));
        root.querySelectorAll(&#x27;.dd-step&#x27;).forEach(el =&gt; el.classList.toggle(&#x27;active&#x27;, el.dataset.screen === name));
        const titles = { create: &#x27;New group departure&#x27;, first: &#x27;Coastal Harvest Escape&#x27;, add: &#x27;Coastal Harvest Escape&#x27;, workspace: &#x27;Coastal Harvest Escape&#x27;, pricing: &#x27;Coastal Harvest Escape&#x27;, preview: &#x27;Coastal Harvest Escape&#x27; };
        root.querySelector(&#x27;#dd-header-title&#x27;).textContent = titles[name];
        if (name === &#x27;add&#x27;) renderAdded();
        if (name === &#x27;workspace&#x27;) renderWorkspace();
        renderIcons();
      }

      function renderAdded() {
        const list = root.querySelector(&#x27;#dd-added-components&#x27;);
        list.innerHTML = components.map((c, i) =&gt; `&lt;div class=&quot;dd-list-row&quot;&gt;&lt;div&gt;&lt;div class=&quot;dd-list-title&quot;&gt;${i + 1}. ${c.name}&lt;/div&gt;&lt;div class=&quot;dd-list-meta&quot;&gt;${c.timing || &#x27;Timing not added&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;dd-pill ${c.placement === &#x27;Optional&#x27; ? &#x27;optional&#x27; : &#x27;&#x27;}&quot;&gt;${c.placement}&lt;/span&gt;&lt;span class=&quot;dd-list-meta&quot;&gt;Fulfillment: Decide later&lt;/span&gt;&lt;/div&gt;`).join(&#x27;&#x27;);
      }

      function populatedComponents() {
        return components.length &gt;= 4 ? components : sampleComponents;
      }

      function renderWorkspace() {
        const empty = root.querySelector(&#x27;#dd-workspace-empty&#x27;);
        const populated = root.querySelector(&#x27;#dd-workspace-populated&#x27;);
        empty.classList.toggle(&#x27;dd-hidden&#x27;, !savedEmpty);
        populated.classList.toggle(&#x27;dd-hidden&#x27;, savedEmpty);
        if (savedEmpty) return;
        root.querySelector(&#x27;#dd-work-components&#x27;).innerHTML = populatedComponents().map((c, i) =&gt; `

development: &recurring_defaults
  mark_eligible_departures_departed:
    class: MarkEligibleDeparturesDepartedJob
    queue: departures
    schedule: every hour
  post_due_supplier_amounts:
    class: PostDueSupplierAmountsJob
    queue: supplier_money
    schedule: every hour at minute 5
  purge_unattached_blobs:
    class: PurgeUnattachedBlobsJob
    queue: documents
    schedule: every day at 3am

production:
  <<: *recurring_defaults
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
